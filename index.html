<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地表倖存者：深海逆鱗 (SSTS)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #020617;
    color: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;

  .screen {

  .btn {

  .story-badge {

  }
  .story-title {
    font-size: 22px;
    font-weight: bold;
    color: #f8fafc;
    letter-spacing: 1.5px;
    text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
  }
  #story-canvas {
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(14, 165, 233, 0.2);
    border: 1px solid #1e293b;
    margin: 10px 0;
  }
  .story-desc {
    font-size: 14.5px;
    line-height: 1.7;
    color: #cbd5e1;
    max-width: 620px;
    min-height: 52px;
    margin: 0 auto;
  }
  .story-nav {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid #475569;
    color: #94a3b8;
    padding: 9px 22px;
    font-size: 13.5px;
    border-radius: 20px;

  }
  .btn-secondary:hover { color: #f1f5f9; border-color: #94a3b8; }

  /* 3. 戰鬥畫面與 HUD */
  #game-container {
    display: none;
    background: #090d16;
  }
  canvas#game-canvas {
    background: #060913;

  #hud {
    position: absolute;

  .bar-bg {
    width: 100%;
    height: 10px;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #334155;
  }
  .bar-fill {
    height: 100%;

  .hud-stats {

  /* 升級彈窗 */
  #upgrade-modal {
    position: absolute;
    inset: 0;
    background: rgba(2, 6, 23, 0.9);

    gap: 14px;

  }
  .upgrade-card {
    background: #0f172a;

    color: white;
    padding: 14px 28px;
    border-radius: 8px;
    cursor: pointer;
    width: 280px;
    text-align: center;
    font-size: 14px;
    transition: transform 0.15s, background 0.2s;
  }
  .upgrade-card:hover {
    background: #0284c7;
    transform: scale(1.04);

</style>

<body>

<!-- 1. 首頁畫面 -->
<div id="title-screen" class="screen">
  <canvas id="logo-canvas" width="700" height="260"></canvas>
  <button class="btn" onclick="startStory()">開始作戰 (START)</button>
</div>

<!-- 2. 故事頁面與動態插圖 -->
<div id="story-screen" class="screen">
  <div class="story-header">
    <div class="progress-dots" id="dots-container"></div>
    <div class="story-badge" id="story-chapter">SSTS // ARCHIVE 01</div>
    <div class="story-title" id="story-title">沉眠者之醒</div>
  </div>

  <!-- 純程式碼繪製的故事插圖 Canvas -->
  <canvas id="story-canvas" width="640" height="230"></canvas>

  <div class="story-desc" id="story-desc">載入中...</div>

<!-- 3. 戰鬥畫面與 HUD -->
<div id="game-container" class="screen">
  <canvas id="game-canvas" width="780" height="540"></canvas>
  <div id="hud">
    <div class="bar-bg"><div class="bar-fill" id="exp-bar"></div></div>
    <div class="hud-stats">
      <span id="txt-level">防衛階級: 1</span>

    </div>
  </div>
  <div id="upgrade-modal">
    <h3 style="color: #38bdf8; letter-spacing: 2px;">防衛系統進化升級</h3>
    <div class="upgrade-card" onclick="chooseUpgrade('firerate')">⚡ 聚焦脈衝冷卻加速 (-20%)</div>
    <div class="upgrade-card" onclick="chooseUpgrade('damage')">💥 電磁等離子增幅 (+40% 傷害)</div>
    <div class="upgrade-card" onclick="chooseUpgrade('speed')">👟 地表突擊推進器 (+15% 移速)</div>
  </div>
</div>

<script>
/* ==================== 音效引擎 (Web Audio API) ==================== */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, type, duration, gainLevel = 0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainLevel, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

/* ==================== 首頁純程式碼動態 LOGO ==================== */
const logoCanvas = document.getElementById('logo-canvas');
const lctx = logoCanvas.getContext('2d');
let logoTime = 0;
let logoAnimId = null;

const bubbles = Array.from({ length: 40 }, () => ({
  x: Math.random() * logoCanvas.width,
  y: Math.random() * logoCanvas.height,
  r: 1 + Math.random() * 2.5,
  speed: 0.3 + Math.random() * 0.7,
  alpha: 0.15 + Math.random() * 0.4
}));

function drawLogo() {
  logoTime += 0.035;
  lctx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);

  // 1. 氣泡粒子
  for (const b of bubbles) {
    b.y -= b.speed;
    if (b.y < -10) { b.y = logoCanvas.height + 10; b.x = Math.random() * logoCanvas.width; }
    lctx.fillStyle = `rgba(56, 189, 248, ${b.alpha})`;
    lctx.beginPath();
    lctx.arc(b.x + Math.sin(logoTime + b.y * 0.05) * 5, b.y, b.r, 0, Math.PI * 2);
    lctx.fill();
  }

  const cx = logoCanvas.width / 2;
  const pulse = Math.sin(logoTime);

  // 2. 縮寫標章 [ SSTS ]
  lctx.save();
  lctx.font = "900 15px 'Courier New', monospace";
  lctx.textAlign = "center";
  lctx.fillStyle = "rgba(56, 189, 248, 0.9)";
  lctx.shadowColor = "#0284c7";
  lctx.shadowBlur = 8 + pulse * 4;
  lctx.fillText("— SSTS · TACTICAL SURVIVAL —", cx, 35);
  lctx.restore();

  // 3. 主標題
  lctx.save();
  lctx.font = "900 39px -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif";
  lctx.textAlign = "center";
  lctx.shadowColor = "rgba(14, 165, 233, 0.85)";
  lctx.shadowBlur = 22 + pulse * 10;

  const textGrad = lctx.createLinearGradient(cx - 200, 0, cx + 200, 0);
  textGrad.addColorStop(0, "#34d399");
  textGrad.addColorStop(0.45, "#38bdf8");
  textGrad.addColorStop(1, "#06b6d4");
  lctx.fillStyle = textGrad;
  lctx.fillText("地表倖存者：深海逆鱗", cx, 102 + Math.sin(logoTime * 0.8) * 2);
  lctx.restore();

  // 4. 英文副標題
  lctx.save();
  lctx.font = "800 15px 'Segoe UI', sans-serif";
  lctx.textAlign = "center";
  lctx.fillStyle = "#94a3b8";
  lctx.shadowColor = "rgba(56, 189, 248, 0.4)";
  lctx.shadowBlur = 6;
  lctx.fillText("SURFACE SURVIVORS: TIDAL SIEGE", cx, 140);
  lctx.restore();

  // 5. 潮汐弦波
  const waveWidth = 280;
  lctx.save();
  lctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
  lctx.lineWidth = 1.5;
  lctx.beginPath();
  for (let x = cx - waveWidth; x <= cx + waveWidth; x += 5) {
    const distFromCenter = 1 - Math.abs(x - cx) / waveWidth;
    const y = 176 + Math.sin(x * 0.04 + logoTime * 2.5) * 6 * distFromCenter;
    if (x === cx - waveWidth) lctx.moveTo(x, y);
    else lctx.lineTo(x, y);
  }
  lctx.stroke();

  // 中心能量核心
  lctx.fillStyle = "#38bdf8";
  lctx.shadowColor = "#38bdf8";
  lctx.shadowBlur = 12 + pulse * 6;
  lctx.beginPath();
  lctx.arc(cx, 176 + Math.sin(cx * 0.04 + logoTime * 2.5) * 6, 3.5, 0, Math.PI * 2);
  lctx.fill();
  lctx.restore();

  logoAnimId = requestAnimationFrame(drawLogo);
}

drawLogo();

/* ==================== 故事頁面與動態插圖渲染系統 ==================== */
const storyCanvas = document.getElementById('story-canvas');
const sctx = storyCanvas.getContext('2d');
let storyTime = 0;
let storyAnimId = null;

const storyData = [
  {
    chapter: "SSTS // ARCHIVE 01",
    title: "海淵巨響 · 沉眠者復甦",
    desc: "歷經數百萬年休眠，沉睡於萬米海溝底部的古老海洋霸主全面睜眼。遠古逆鱗共振引發深海熱泉狂潮，海洋不再溫馴，化為狂暴的變異進化母體。"
  },
  {
    chapter: "SSTS // ARCHIVE 02",
    title: "逆鱗狂潮 · 異種登陸",
    desc: "深海巨獸散發出超導進化信號。魚群長出覆甲足肢，水母演化出懸浮腺體，數以萬計的變異海嗣撕裂海岸堤防，黑潮正迅速吞噬沿海防線！"
  },
  {
    chapter: "SSTS // ARCHIVE 03",
    title: "地表同盟 · 孤注一擲",
    desc: "地表文明已無路可退。地表抗衛軍緊急配備「方舟核心」自動等離子機甲，作為阻擋海嗣擴散的第一道，也是最後一道防線！"
  },
  {
    chapter: "SSTS // MISSION START",
    title: "陸防前線 · 迎擊異形海嗣",
    desc: "突變潮汐已抵達據點周遭！請啟動自動追蹤脈衝，殲滅所有靠近防線的海底進化生物，守衛陸地生靈的生機！"
  }
];

let storyIndex = 0;

function drawStoryIllustration() {
  storyTime += 0.04;
  sctx.clearRect(0, 0, storyCanvas.width, storyCanvas.height);
  const w = storyCanvas.width;
  const h = storyCanvas.height;
  const cx = w / 2;
  const cy = h / 2;

  if (storyIndex === 0) {
    // 【動態插圖 1：深海霸王巨眼】
    const grad = sctx.createRadialGradient(cx, cy, 20, cx, cy, 140);
    grad.addColorStop(0, '#0c4a6e');
    grad.addColorStop(0.7, '#082f49');
    grad.addColorStop(1, '#020617');
    sctx.fillStyle = grad;
    sctx.fillRect(0, 0, w, h);

    // 熱泉熱氣泡
    for (let i = 0; i < 18; i++) {
      const bx = (Math.sin(i * 99 + storyTime * 0.8) * 0.5 + 0.5) * w;
      const by = (h - ((storyTime * 35 + i * 25) % h));
      sctx.fillStyle = "rgba(56, 189, 248, 0.25)";
      sctx.beginPath();
      sctx.arc(bx, by, (i % 3) + 1.5, 0, Math.PI * 2);
      sctx.fill();
    }

    // 巨眼外輪廓眼瞼
    const eyeScaleY = 0.65 + Math.sin(storyTime * 0.8) * 0.08;
    sctx.save();
    sctx.translate(cx, cy);
    sctx.scale(1, eyeScaleY);

    sctx.strokeStyle = '#0284c7';
    sctx.lineWidth = 3;
    sctx.shadowColor = '#38bdf8';
    sctx.shadowBlur = 18;
    sctx.beginPath();
    sctx.ellipse(0, 0, 110, 60, 0, 0, Math.PI * 2);
    sctx.stroke();

    // 虹膜
    const irisGrad = sctx.createRadialGradient(0, 0, 5, 0, 0, 55);
    irisGrad.addColorStop(0, '#f59e0b');
    irisGrad.addColorStop(0.6, '#06b6d4');
    irisGrad.addColorStop(1, '#082f49');
    sctx.fillStyle = irisGrad;
    sctx.beginPath();
    sctx.arc(0, 0, 50, 0, Math.PI * 2);
    sctx.fill();

    // 瞳孔（爬蟲垂直裂縫微呼吸）
    const pupilW = 8 + Math.sin(storyTime * 2) * 2.5;
    sctx.fillStyle = '#020617';
    sctx.shadowBlur = 0;
    sctx.beginPath();
    sctx.ellipse(0, 0, pupilW, 44, 0, 0, Math.PI * 2);
    sctx.fill();

    // 反光高光
    sctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    sctx.beginPath();
    sctx.arc(-16, -14, 5, 0, Math.PI * 2);
    sctx.fill();
    sctx.restore();

  } else if (storyIndex === 1) {
    // 【動態插圖 2：逆鱗狂潮沸騰海浪】
    sctx.fillStyle = '#030712';
    sctx.fillRect(0, 0, w, h);

    // 三層動態洶湧波濤
    const layers = [
      { color: 'rgba(12, 74, 110, 0.4)', speed: 1.2, amp: 20, freq: 0.015, yOff: 110 },
      { color: 'rgba(2, 132, 199, 0.5)', speed: 1.8, amp: 28, freq: 0.02, yOff: 135 },
      { color: 'rgba(56, 189, 248, 0.7)', speed: 2.6, amp: 18, freq: 0.028, yOff: 165 }
    ];

    layers.forEach(l => {
      sctx.fillStyle = l.color;
      sctx.beginPath();
      sctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 8) {
        const y = l.yOff + Math.sin(x * l.freq + storyTime * l.speed) * l.amp;
        sctx.lineTo(x, y);
      }
      sctx.lineTo(w, h);
      sctx.closePath();
      sctx.fill();
    });

    // 跳躍登陸的變異海嗣光影
    for (let j = 0; j < 5; j++) {
      const jx = (w * 0.2) + j * 90 + Math.sin(storyTime + j) * 20;
      const jumpY = 130 + Math.sin(storyTime * 2.5 + j * 1.5) * 35;
      sctx.fillStyle = '#f43f5e';
      sctx.shadowColor = '#f43f5e';
      sctx.shadowBlur = 10;
      sctx.beginPath();
      sctx.arc(jx, jumpY, 5, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.shadowBlur = 0;

  } else if (storyIndex === 2) {
    // 【動態插圖 3：地表同盟電磁防禦護盾】
    sctx.fillStyle = '#050c1a';
    sctx.fillRect(0, 0, w, h);

    // 防禦陣列核心基地
    sctx.fillStyle = '#10b981';
    sctx.shadowColor = '#10b981';
    sctx.shadowBlur = 20;
    sctx.beginPath();
    sctx.arc(cx, cy + 50, 22, 0, Math.PI * 2);
    sctx.fill();
    sctx.shadowBlur = 0;

    // 半球防禦護盾
    const shieldPulse = Math.sin(storyTime * 3) * 4;
    sctx.save();
    sctx.strokeStyle = '#34d399';
    sctx.lineWidth = 2.5;
    sctx.shadowColor = '#34d399';
    sctx.shadowBlur = 16 + shieldPulse;
    sctx.beginPath();
    sctx.arc(cx, cy + 50, 95 + shieldPulse, Math.PI, Math.PI * 2);
    sctx.stroke();

    // 蜂巢防禦力場擴散波
    for (let r = 30; r < 95; r += 24) {
      sctx.strokeStyle = `rgba(52, 211, 153, ${0.15 + Math.sin(storyTime + r) * 0.1})`;
      sctx.lineWidth = 1;
      sctx.beginPath();
      sctx.arc(cx, cy + 50, r, Math.PI, Math.PI * 2);
      sctx.stroke();
    }

    // 外圍海潮侵蝕雷擊/撞擊火花
    for (let k = 0; k < 4; k++) {
      const angle = Math.PI + (k + 0.5) * (Math.PI / 4) + Math.sin(storyTime * 4 + k) * 0.1;
      const hitX = cx + Math.cos(angle) * (95 + shieldPulse);
      const hitY = (cy + 50) + Math.sin(angle) * (95 + shieldPulse);
      sctx.fillStyle = '#38bdf8';
      sctx.shadowColor = '#38bdf8';
      sctx.shadowBlur = 10;
      sctx.beginPath();
      sctx.arc(hitX, hitY, 3.5, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.restore();

  } else {
    // 【動態插圖 4：作戰前線戰術雷達警報】
    sctx.fillStyle = '#080a12';
    sctx.fillRect(0, 0, w, h);

    // 圓形雷達網
    sctx.strokeStyle = 'rgba(239, 68, 68, 0.3)';
    sctx.lineWidth = 1;
    for (let r = 30; r <= 100; r += 25) {
      sctx.beginPath();
      sctx.arc(cx, cy, r, 0, Math.PI * 2);
      sctx.stroke();
    }
    sctx.beginPath();
    sctx.moveTo(cx - 105, cy); sctx.lineTo(cx + 105, cy);
    sctx.moveTo(cx, cy - 105); sctx.lineTo(cx, cy + 105);
    sctx.stroke();

    // 360 度旋轉雷達掃描光束
    const sweepAngle = (storyTime * 2.8) % (Math.PI * 2);
    sctx.save();
    sctx.translate(cx, cy);
    sctx.rotate(sweepAngle);
    const sweepGrad = sctx.createLinearGradient(0, 0, 105, 0);
    sweepGrad.addColorStop(0, 'rgba(239, 68, 68, 0.4)');
    sweepGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
    sctx.fillStyle = sweepGrad;
    sctx.beginPath();
    sctx.moveTo(0, 0);
    sctx.arc(0, 0, 105, 0, -0.45, true);
    sctx.closePath();
    sctx.fill();
    sctx.restore();

    // 逼近的合圍敵群點
    for (let m = 0; m < 9; m++) {
      const eDist = 85 - (m * 4) + Math.sin(storyTime + m) * 4;
      const eAngle = m * 0.72 + (storyTime * 0.1);
      const ex = cx + Math.cos(eAngle) * eDist;
      const ey = cy + Math.sin(eAngle) * eDist;
      sctx.fillStyle = '#ef4444';
      sctx.shadowColor = '#ef4444';
      sctx.shadowBlur = 8;
      sctx.beginPath();
      sctx.arc(ex, ey, 3.5, 0, Math.PI * 2);
      sctx.fill();
    }

    // 警報字樣
    sctx.font = "900 13px monospace";
    sctx.textAlign = "center";
    sctx.fillStyle = `rgba(239, 68, 68, ${0.4 + Math.sin(storyTime * 6) * 0.4})`;
    sctx.fillText("! WARNING: TIDAL SWARM INBOUND !", cx, cy + 95);
    sctx.shadowBlur = 0;
  }

  storyAnimId = requestAnimationFrame(drawStoryIllustration);
}

function startStory() {
  initAudio();
  playTone(440, 'triangle', 0.2);
  if (logoAnimId) cancelAnimationFrame(logoAnimId);
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('story-screen').style.display = 'flex';
  renderStory();
  if (!storyAnimId) drawStoryIllustration();
}

function renderStory() {
  const current = storyData[storyIndex];
  document.getElementById('story-chapter').innerText = current.chapter;
  document.getElementById('story-title').innerText = current.title;
  document.getElementById('story-desc').innerText = current.desc;

  const dotsContainer = document.getElementById('dots-container');
  dotsContainer.innerHTML = '';
  storyData.forEach((_, idx) => {
    const dot = document.createElement('div');
    dot.className = `dot ${idx === storyIndex ? 'active' : ''}`;
    dotsContainer.appendChild(dot);
  });

  const nextBtn = document.getElementById('next-story-btn');
  if (storyIndex === storyData.length - 1) {
    nextBtn.innerText = "踏入戰場 (BATTLE)";
    nextBtn.style.background = "linear-gradient(135deg, #e11d48, #be123c)";
    nextBtn.style.borderColor = "#f43f5e";
  } else {
    nextBtn.innerText = "下一頁 (NEXT)";
    nextBtn.style.background = "linear-gradient(135deg, #0284c7, #0369a1)";
    nextBtn.style.borderColor = "#38bdf8";
  }
}

function nextStory() {
  playTone(550, 'sine', 0.15);
  storyIndex++;
  if (storyIndex >= storyData.length) {
    enterGame();
  } else {
    renderStory();
  }
}

function enterGame() {
  initAudio();
  playTone(330, 'square', 0.4);
  if (storyAnimId) {
    cancelAnimationFrame(storyAnimId);
    storyAnimId = null;
  }
  document.getElementById('story-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'flex';
  initGame();
}

/* ==================== 割草遊戲核心戰鬥 ==================== */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const expBar = document.getElementById('exp-bar');
const txtLevel = document.getElementById('txt-level');
const txtKills = document.getElementById('txt-kills');
const txtHp = document.getElementById('txt-hp');
const upgradeModal = document.getElementById('upgrade-modal');

let isPaused = false;
let kills = 0;
let gameRunning = false;

const player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 13,
  speed: 2.8,
  hp: 100,
  maxHp: 100,
  exp: 0,
  level: 1,
  nextExp: 6,
  bulletSpeed: 7,
  bulletDamage: 30,
  fireInterval: 32,
  fireTimer: 0
};

const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let enemies = [];
let bullets = [];
let gems = [];
let spawnInterval = 30;
let spawnTimer = 0;

function initGame() {
  if (gameRunning) return;
  gameRunning = true;
  requestAnimationFrame(gameLoop);
}

function spawnSeaEnemy() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = Math.random() * canvas.width; y = -20; }
  else if (edge === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
  else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
  else { x = -20; y = Math.random() * canvas.height; }

  const isJelly = Math.random() > 0.45;
  enemies.push({
    x, y,
    type: isJelly ? 'jelly' : 'fish',
    radius: isJelly ? 12 : 9,
    speed: isJelly ? (1.0 + Math.random() * 0.3) : (1.6 + Math.random() * 0.4),
    hp: isJelly ? (42 + player.level * 8) : (24 + player.level * 4),
    pulse: 0
  });
}

function shootNearest() {
  if (enemies.length === 0) return;
  let nearest = null;
  let minDist = Infinity;
  for (const enemy of enemies) {
    const d = Math.hypot(enemy.x - player.x, enemy.y - player.y);
    if (d < minDist) { minDist = d; nearest = enemy; }
  }
  if (!nearest) return;

  const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
  bullets.push({
    x: player.x, y: player.y,
    vx: Math.cos(angle) * player.bulletSpeed,
    vy: Math.sin(angle) * player.bulletSpeed,
    radius: 4,
    damage: player.bulletDamage
  });
  playTone(880, 'square', 0.08, 0.05);
}

function updateGame() {
  if (isPaused) return;

  // 玩家移動
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + dx * player.speed));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + dy * player.speed));

  // 自動發射脈衝
  player.fireTimer++;
  if (player.fireTimer >= player.fireInterval) {
    shootNearest();
    player.fireTimer = 0;
  }

  // 子彈飛行與碰撞
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
      bullets.splice(i, 1);
      continue;
    }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
        e.hp -= b.damage;
        bullets.splice(i, 1);
        playTone(300, 'sawtooth', 0.05, 0.04);
        if (e.hp <= 0) {
          gems.push({ x: e.x, y: e.y, radius: 4 });
          enemies.splice(j, 1);
          kills++;
          txtKills.innerText = `擊退海嗣: ${kills}`;
        }
        break;
      }
    }
  }

  // 敵人追逐與碰撞
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnSeaEnemy();
    spawnTimer = 0;
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.pulse += 0.08;
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * e.speed;
    e.y += Math.sin(angle) * e.speed;

    if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
      player.hp -= 0.35;
      txtHp.innerText = `核心護甲: ${Math.max(0, Math.floor(player.hp))}/${player.maxHp}`;
      if (player.hp <= 0) {
        alert(`防禦要塞失守！你共消滅了 ${kills} 隻登陸海嗣。`);
        location.reload();
      }
    }
  }

  // 經驗晶體吸附
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    const dist = Math.hypot(player.x - g.x, player.y - g.y);
    if (dist < 65) {
      const angle = Math.atan2(player.y - g.y, player.x - g.x);
      g.x += Math.cos(angle) * 5.5;
      g.y += Math.sin(angle) * 5.5;
    }
    if (dist < player.radius + g.radius) {
      gems.splice(i, 1);
      player.exp++;
      playTone(1050, 'sine', 0.05, 0.03);
      if (player.exp >= player.nextExp) triggerLevelUp();
      expBar.style.width = `${(player.exp / player.nextExp) * 100}%`;
    }
  }
}

function triggerLevelUp() {
  isPaused = true;
  player.level++;
  player.exp = 0;
  player.nextExp = Math.floor(player.nextExp * 1.4);
  txtLevel.innerText = `防衛階級: ${player.level}`;
  upgradeModal.style.display = 'flex';
  playTone(700, 'sine', 0.3, 0.1);
}

function chooseUpgrade(type) {
  if (type === 'firerate') player.fireInterval = Math.max(8, Math.floor(player.fireInterval * 0.8));
  if (type === 'damage') player.bulletDamage = Math.floor(player.bulletDamage * 1.4);
  if (type === 'speed') player.speed *= 1.15;
  upgradeModal.style.display = 'none';
  isPaused = false;
}

function renderGame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 背景科技網格
  ctx.strokeStyle = "rgba(14, 165, 233, 0.06)";
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // 能源晶體（發光菱形）
  for (const g of gems) {
    ctx.fillStyle = '#38bdf8';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#0284c7';
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - g.radius);
    ctx.lineTo(g.x + g.radius, g.y);
    ctx.lineTo(g.x, g.y + g.radius);
    ctx.lineTo(g.x - g.radius, g.y);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 電磁子彈
  ctx.fillStyle = '#67e8f9';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#38bdf8';
  for (const b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 登陸海嗣（敵種）
  for (const e of enemies) {
    if (e.type === 'jelly') {
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + Math.sin(e.pulse) * 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 地表抗衛核心（玩家）
  ctx.fillStyle = '#10b981';
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#10b981';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function gameLoop() {
  updateGame();
  renderGame();
  requestAnimationFrame(gameLoop);
}
</script>
