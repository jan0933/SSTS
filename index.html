<style>

  #story-screen {
    background: #030712;

    padding: 40px;

  .story-badge {
    display: inline-block;

    margin-bottom: 18px;
  }
  .story-title {
    font-size: 26px;
    font-weight: bold;

  }
  .story-desc {
    font-size: 16px;

  .story-nav {
    display: flex;

    justify-content: center;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid #475569;
    color: #94a3b8;
    padding: 10px 24px;
    font-size: 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  .btn-secondary:hover { color: #f1f5f9; border-color: #94a3b8; }
  .progress-dots {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;

    transition: all 0.3s;

  .dot.active {
    background: #38bdf8;

  /* 3. 戰鬥畫面與 HUD */
  #game-container {
    display: none;
    background: #090d16;
  }
  canvas#game-canvas {
    background: #060913;
    display: block;

  #hud {
    position: absolute;
    top: 14px;

    right: 16px;
    pointer-events: none;
  }
  .bar-bg {
    width: 100%;
    height: 10px;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #334155;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;

  }
  .hud-stats {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;

  /* 升級彈窗 */
  #upgrade-modal {
    position: absolute;
    inset: 0;
    background: rgba(2, 6, 23, 0.9);
    display: none;

    justify-content: center;

    background: #0f172a;
    border: 1px solid #38bdf8;

    padding: 14px 28px;
    border-radius: 8px;
    cursor: pointer;
    width: 270px;
    text-align: center;
    font-size: 14px;
    transition: transform 0.15s, background 0.2s;
  }
  .upgrade-card:hover {
    background: #0284c7;
    transform: scale(1.04);
  }
</style>
</head>
<body>

<!-- 1. 首頁與純 Canvas 動態發光 Logo -->
<div id="title-screen" class="screen">
  <canvas id="logo-canvas" width="680" height="250"></canvas>
  <button class="btn" onclick="startStory()">開始作戰 (START)</button>

<div id="story-screen" class="screen">

<!-- 3. 遊戲畫布與戰鬥 HUD -->
<div id="game-container" class="screen">
  <canvas id="game-canvas" width="760" height="520"></canvas>
  <div id="hud">

    <div class="upgrade-card" onclick="chooseUpgrade('damage')">💥 電磁等離子增幅 (+40% 傷害)</div>
    <div class="upgrade-card" onclick="chooseUpgrade('speed')">👟 地表突擊推進器 (+15% 移速)</div>
  </div>
</div>

<script>
/* ==================== 音效引擎 (Web Audio API) ==================== */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, type, duration, gainLevel = 0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainLevel, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

/* ==================== 首頁純程式碼動態發光 LOGO ==================== */
const logoCanvas = document.getElementById('logo-canvas');
const lctx = logoCanvas.getContext('2d');
let logoTime = 0;
let logoAnimId = null;

// 背景浮游生物 / 氣泡粒子
const bubbles = Array.from({ length: 35 }, () => ({
  x: Math.random() * logoCanvas.width,
  y: Math.random() * logoCanvas.height,
  r: 1 + Math.random() * 2.5,
  speed: 0.3 + Math.random() * 0.7,
  alpha: 0.15 + Math.random() * 0.4
}));

function drawLogo() {
  logoTime += 0.035;
  lctx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);

  // 1. 繪製氣泡流
  for (const b of bubbles) {
    b.y -= b.speed;
    if (b.y < -10) { b.y = logoCanvas.height + 10; b.x = Math.random() * logoCanvas.width; }
    lctx.fillStyle = `rgba(56, 189, 248, ${b.alpha})`;
    lctx.beginPath();
    lctx.arc(b.x + Math.sin(logoTime + b.y * 0.05) * 5, b.y, b.r, 0, Math.PI * 2);
    lctx.fill();
  }

  const cx = logoCanvas.width / 2;
  const pulse = Math.sin(logoTime);

  // 2. 繪製頂部縮寫徽章 [ SSTS ]
  lctx.save();
  lctx.font = "900 15px 'Courier New', monospace";
  lctx.textAlign = "center";
  lctx.fillStyle = "rgba(56, 189, 248, 0.9)";
  lctx.shadowColor = "#0284c7";
  lctx.shadowBlur = 8 + pulse * 4;
  lctx.letterSpacing = "6px";
  lctx.fillText("— SSTS · TACTICAL SURVIVAL —", cx, 35);
  lctx.restore();

  // 3. 繪製主標題：《地表倖存者：深海逆鱗》
  lctx.save();
  lctx.font = "900 38px -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif";
  lctx.textAlign = "center";

  // 外發光層
  lctx.shadowColor = "rgba(14, 165, 233, 0.8)";
  lctx.shadowBlur = 20 + pulse * 10;

  // 雙色霓虹漸層（地表翠綠 / 逆潮青藍）
  const textGrad = lctx.createLinearGradient(cx - 200, 0, cx + 200, 0);
  textGrad.addColorStop(0, "#34d399"); // 陸地生命綠
  textGrad.addColorStop(0.45, "#38bdf8"); // 潮汐藍
  textGrad.addColorStop(1, "#06b6d4"); // 逆鱗青
  lctx.fillStyle = textGrad;
  lctx.fillText("地表倖存者：深海逆鱗", cx, 98 + Math.sin(logoTime * 0.8) * 2);
  lctx.restore();

  // 4. 繪製英文副標題：Surface Survivors: Tidal Siege
  lctx.save();
  lctx.font = "800 15px 'Segoe UI', sans-serif";
  lctx.textAlign = "center";
  lctx.fillStyle = "#94a3b8";
  lctx.letterSpacing = "3.5px";
  lctx.shadowColor = "rgba(56, 189, 248, 0.4)";
  lctx.shadowBlur = 6;
  lctx.fillText("SURFACE SURVIVORS: TIDAL SIEGE", cx, 134);
  lctx.restore();

  // 5. 繪製中央深海波動能量條
  const waveWidth = 260;
  lctx.save();
  lctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
  lctx.lineWidth = 1.5;
  lctx.beginPath();
  for (let x = cx - waveWidth; x <= cx + waveWidth; x += 5) {
    const distFromCenter = 1 - Math.abs(x - cx) / waveWidth;
    const y = 168 + Math.sin(x * 0.04 + logoTime * 2.5) * 6 * distFromCenter;
    if (x === cx - waveWidth) lctx.moveTo(x, y);
    else lctx.lineTo(x, y);
  }
  lctx.stroke();

  // 波動中心發光核心
  lctx.fillStyle = "#38bdf8";
  lctx.shadowColor = "#38bdf8";
  lctx.shadowBlur = 12 + pulse * 6;
  lctx.beginPath();
  lctx.arc(cx, 168 + Math.sin(cx * 0.04 + logoTime * 2.5) * 6, 3.5, 0, Math.PI * 2);
  lctx.fill();
  lctx.restore();

  logoAnimId = requestAnimationFrame(drawLogo);
}

drawLogo();

/* ==================== 故事狀態與切換邏輯 ==================== */
const storyData = [
  {
    chapter: "SSTS // ARCHIVE 01",
    title: "海淵巨響 · 沉眠者復甦",
    desc: "歷經數百萬年休眠，沉睡於萬米海溝深處的海洋霸主全面睜眼。遠古逆鱗共振引發深海熱泉狂潮，海洋不再溫馴，化為狂暴的變異進化母體。"
  },
  {
    chapter: "SSTS // ARCHIVE 02",
    title: "逆鱗狂潮 · 異種登陸",
    desc: "深海巨獸散發出超導進化信號。魚群長出覆甲足肢，水母演化出懸浮腺體，數以萬計的變異海嗣撕裂海岸堤防，黑潮正迅速吞噬沿海防線！"
  },
  {
    chapter: "SSTS // ARCHIVE 03",
    title: "地表同盟 · 孤注一擲",
    desc: "地表文明已無路可退。地表抗衛軍緊急配備「方舟核心」自動等離子機甲，作為阻擋海嗣擴散的第一道，也是最後一道防線！"
  },
  {
    chapter: "SSTS // MISSION START",
    title: "陸防前線 · 迎擊異形海嗣",
    desc: "突變潮汐已抵達據點周遭！請啟動自動追蹤脈衝，殲滅所有靠近防線的海底進化生物，守衛陸地生靈的生機！"
  }
];

let storyIndex = 0;

function startStory() {
  initAudio();
  playTone(440, 'triangle', 0.2);
  if (logoAnimId) cancelAnimationFrame(logoAnimId);
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('story-screen').style.display = 'flex';
  renderStory();
}

function renderStory() {
  const current = storyData[storyIndex];
  document.getElementById('story-chapter').innerText = current.chapter;
  document.getElementById('story-title').innerText = current.title;
  document.getElementById('story-desc').innerText = current.desc;

  const dotsContainer = document.getElementById('dots-container');
  dotsContainer.innerHTML = '';
  storyData.forEach((_, idx) => {
    const dot = document.createElement('div');
    dot.className = `dot ${idx === storyIndex ? 'active' : ''}`;
    dotsContainer.appendChild(dot);
  });

  const nextBtn = document.getElementById('next-story-btn');
  if (storyIndex === storyData.length - 1) {
    nextBtn.innerText = "踏入戰場 (BATTLE)";
    nextBtn.style.background = "linear-gradient(135deg, #e11d48, #be123c)";
    nextBtn.style.borderColor = "#f43f5e";
  } else {
    nextBtn.innerText = "下一頁 (NEXT)";
    nextBtn.style.background = "linear-gradient(135deg, #0284c7, #0369a1)";
    nextBtn.style.borderColor = "#38bdf8";
  }
}

function nextStory() {
  playTone(550, 'sine', 0.15);
  storyIndex++;
  if (storyIndex >= storyData.length) {
    enterGame();
  } else {
    renderStory();
  }
}

function enterGame() {
  initAudio();
  playTone(330, 'square', 0.4);
  document.getElementById('story-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'flex';
  initGame();
}

/* ==================== 割草遊戲核心戰鬥 ==================== */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const expBar = document.getElementById('exp-bar');
const txtLevel = document.getElementById('txt-level');
const txtKills = document.getElementById('txt-kills');
const txtHp = document.getElementById('txt-hp');
const upgradeModal = document.getElementById('upgrade-modal');

let isPaused = false;
let kills = 0;
let gameRunning = false;

const player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 13,
  speed: 2.8,
  hp: 100,
  maxHp: 100,
  exp: 0,
  level: 1,
  nextExp: 6,
  bulletSpeed: 7,
  bulletDamage: 30,
  fireInterval: 32,
  fireTimer: 0
};

const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let enemies = [];
let bullets = [];
let gems = [];
let spawnInterval = 30;
let spawnTimer = 0;

function initGame() {
  if (gameRunning) return;
  gameRunning = true;
  requestAnimationFrame(gameLoop);
}

function spawnSeaEnemy() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = Math.random() * canvas.width; y = -20; }
  else if (edge === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
  else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
  else { x = -20; y = Math.random() * canvas.height; }

  const isJelly = Math.random() > 0.45;
  enemies.push({
    x, y,
    type: isJelly ? 'jelly' : 'fish',
    radius: isJelly ? 12 : 9,
    speed: isJelly ? (1.0 + Math.random() * 0.3) : (1.6 + Math.random() * 0.4),
    hp: isJelly ? (42 + player.level * 8) : (24 + player.level * 4),
    pulse: 0
  });
}

function shootNearest() {
  if (enemies.length === 0) return;
  let nearest = null;
  let minDist = Infinity;
  for (const enemy of enemies) {
    const d = Math.hypot(enemy.x - player.x, enemy.y - player.y);
    if (d < minDist) { minDist = d; nearest = enemy; }
  }
  if (!nearest) return;

  const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
  bullets.push({
    x: player.x, y: player.y,
    vx: Math.cos(angle) * player.bulletSpeed,
    vy: Math.sin(angle) * player.bulletSpeed,
    radius: 4,
    damage: player.bulletDamage
  });
  playTone(880, 'square', 0.08, 0.05);
}

function updateGame() {
  if (isPaused) return;

  // 玩家移動
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + dx * player.speed));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + dy * player.speed));

  // 自動發射脈衝
  player.fireTimer++;
  if (player.fireTimer >= player.fireInterval) {
    shootNearest();
    player.fireTimer = 0;
  }

  // 子彈飛行與命中
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
      bullets.splice(i, 1);
      continue;
    }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
        e.hp -= b.damage;
        bullets.splice(i, 1);
        playTone(300, 'sawtooth', 0.05, 0.04);
        if (e.hp <= 0) {
          gems.push({ x: e.x, y: e.y, radius: 4 });
          enemies.splice(j, 1);
          kills++;
          txtKills.innerText = `擊退海嗣: ${kills}`;
        }
        break;
      }
    }
  }

  // 敵人追逐與碰撞
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnSeaEnemy();
    spawnTimer = 0;
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.pulse += 0.08;
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * e.speed;
    e.y += Math.sin(angle) * e.speed;

    if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
      player.hp -= 0.35;
      txtHp.innerText = `核心護甲: ${Math.max(0, Math.floor(player.hp))}/${player.maxHp}`;
      if (player.hp <= 0) {
        alert(`防禦要塞失守！你共消滅了 ${kills} 隻登陸海嗣。`);
        location.reload();
      }
    }
  }

  // 經驗晶體吸附
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    const dist = Math.hypot(player.x - g.x, player.y - g.y);
    if (dist < 65) {
      const angle = Math.atan2(player.y - g.y, player.x - g.x);
      g.x += Math.cos(angle) * 5.5;
      g.y += Math.sin(angle) * 5.5;
    }
    if (dist < player.radius + g.radius) {
      gems.splice(i, 1);
      player.exp++;
      playTone(1050, 'sine', 0.05, 0.03);
      if (player.exp >= player.nextExp) triggerLevelUp();
      expBar.style.width = `${(player.exp / player.nextExp) * 100}%`;
    }
  }
}

function triggerLevelUp() {
  isPaused = true;
  player.level++;
  player.exp = 0;
  player.nextExp = Math.floor(player.nextExp * 1.4);
  txtLevel.innerText = `防衛階級: ${player.level}`;
  upgradeModal.style.display = 'flex';
  playTone(700, 'sine', 0.3, 0.1);
}

function chooseUpgrade(type) {
  if (type === 'firerate') player.fireInterval = Math.max(8, Math.floor(player.fireInterval * 0.8));
  if (type === 'damage') player.bulletDamage = Math.floor(player.bulletDamage * 1.4);
  if (type === 'speed') player.speed *= 1.15;
  upgradeModal.style.display = 'none';
  isPaused = false;
}

function renderGame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 背景科技網格
  ctx.strokeStyle = "rgba(14, 165, 233, 0.06)";
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // 能源晶體（發光菱形）
  for (const g of gems) {
    ctx.fillStyle = '#38bdf8';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#0284c7';
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - g.radius);
    ctx.lineTo(g.x + g.radius, g.y);
    ctx.lineTo(g.x, g.y + g.radius);
    ctx.lineTo(g.x - g.radius, g.y);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 電磁子彈
  ctx.fillStyle = '#67e8f9';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#38bdf8';
  for (const b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 登陸海嗣（敵種）
  for (const e of enemies) {
    if (e.type === 'jelly') {
      ctx.fillStyle = '#ec4899'; // 幽浮水母
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + Math.sin(e.pulse) * 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#f43f5e'; // 突變寄生魚
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 地表抗衛核心（玩家）
  ctx.fillStyle = '#10b981';
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#10b981';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function gameLoop() {
  updateGame();
  renderGame();
  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
